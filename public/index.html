<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dvary Game - Malipo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Dvary Game</h2>
        <p>Weka namba ya simu kulipia</p>
        <input type="text" id="phone" placeholder="Mfano: 255682812345">
        <button onclick="lipiaNgoma()">Lipa Sasa</button>
    </div>

    <script>
        async function lipiaNgoma() {
            const phone = document.getElementById('phone').value;
            if(!phone) {
                alert("Tafadhali weka namba ya simu kwanza!");
                return;
            }

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ buyer_phone: phone, amount: 1000 })
                });

                const result = await response.json();
                alert(result.message || "Ombi limetumwa kwa mafanikio!");
            } catch (error) {
                alert("Kosa limetokea: " + error.message);
            }
        }
    </script>
</body>
</html>
